name: Scheduled price check

on:
  # GitHub Actions cron uses UTC. Runs every 6 hours.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-deal-hunter-price-check
  cancel-in-progress: false

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch prices and notify on drops
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '5' }}
          DATABASE_PATH: data/prices.db
        run: |
          if [ -z "$KEEPA_API_KEY" ]; then
            echo "Missing repository secret: KEEPA_API_KEY"
            exit 1
          fi
          python -m src.main --provider keepa

      - name: Preserve price history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-history
          path: data/prices.db
          if-no-files-found: ignore
          retention-days: 30
